<!DOCTYPE html>
<html lang="de" class="h-full bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtmoTube PRO Logger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .status-pulsing { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-800 rounded-xl shadow-2xl p-6 md:p-8 border border-gray-700">
        
        <div class="flex items-center justify-center mb-6">
            <!-- Platzhalter-Logo oder Icon -->
            <svg class="w-12 h-12 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h1 class="text-3xl font-bold text-white ml-4">AtmoTube PRO 1</h1>
        </div>

        <p class="text-center text-lg text-gray-400 mb-8">CSV-Datenlogger für AtmoTube PRO</p>

        <div class="space-y-6">
            <!-- Statusanzeige -->
            <div id="statusDisplay" class="text-center bg-gray-900 rounded-lg p-4">
                <span id="statusText" class="text-lg font-medium text-blue-300">Bereit zum Verbinden</span>
            </div>

            <!-- Schritt 1: Verbinden -->
            <button id="connectButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:-translate-y-0.5">
                1. Mit AtmoTube PRO verbinden
            </button>

            <!-- Schritt 2: Messung starten -->
            <button id="startButton" class="w-full bg-gray-600 text-white font-bold py-3 px-4 rounded-lg cursor-not-allowed" disabled>
                2. Messung starten
            </button>

            <!-- Schritt 3: Messung stoppen -->
            <button id="stopButton" class="w-full bg-gray-600 text-white font-bold py-3 px-4 rounded-lg cursor-not-allowed" disabled>
                3. Messung stoppen & Speichern
            </button>
        </div>
        
    </div>

    <script>
        // --- AtmoTube PRO (Modell 2) UUIDs ---
        // Basierend auf https://support.atmotube.com/en/articles/10364981-bluetooth-api
        // Untere Tabelle "Atmotube PRO model / Atmotube 2 model"
        
        // Der Hauptdienst, der alle Sensordaten bereitstellt
        const ATOMTUBE_PRO_SERVICE_UUID = '48280001-0000-1000-8000-00805f9b34fb';
        
        // PM (PM1, PM2.5, PM10)
        const PM_CHAR_UUID = '48280002-0000-1000-8000-00805f9b34fb';
        
        // VOC (flüchtige organische Verbindungen)
        const VOC_CHAR_UUID = '48280003-0000-1000-8000-00805f9b34fb';
        
        // Temperatur und Luftfeuchtigkeit
        const TEMP_HUM_CHAR_UUID = '48280004-0000-1000-8000-00805f9b34fb';
        
        // Luftdruck
        const PRESSURE_CHAR_UUID = '48280005-0000-1000-8000-00805f9b34fb';

        // CO2 (Kohlenstoffdioxid)
        const CO2_CHAR_UUID = '48280006-0000-1000-8000-00805f9b34fb';

        // Globale Variablen
        let bleDevice;
        let bleServer;
        let atmoTubeService;
        let csvContent = '';
        let isMeasuring = false;
        let measurementInterval;

        // Charakteristiken
        let pmChar, vocChar, tempHumChar, pressureChar, co2Char;

        // Zustandsspeicherung für die Sensordaten
        let currentAtmoTubeData = {
            timestamp: '',
            pm1: 0.0,
            pm2_5: 0.0,
            pm10: 0.0,
            voc: 0.0,
            temperature: 0.0,
            humidity: 0.0,
            pressure: 0.0,
            co2: 0
        };

        // DOM-Elemente
        const connectButton = document.getElementById('connectButton');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const statusText = document.getElementById('statusText');
        const statusDisplay = document.getElementById('statusDisplay');

        // Event-Listener
        connectButton.addEventListener('click', connectToDevice);
        startButton.addEventListener('click', startMeasurement);
        stopButton.addEventListener('click', stopMeasurement);

        async function connectToDevice() {
            try {
                statusText.innerText = 'Suche Gerät...';
                
                // Gerätesuche über Web Bluetooth API
                // WICHTIG: "Standort" (GPS) muss auf dem Handy aktiviert sein!
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    // filters: [{
                    //    services: [ATOMTUBE_PRO_SERVICE_UUID]
                    // }]
                    // Der Filter (Plan A) schlägt fehl, da das "normale PRO" (Modell 1)
                    // seinen Dienst offenbar nicht bewirbt, um Strom zu sparen.
                    
                    // Wir gehen zurück zu Plan C (alle Geräte akzeptieren), um das Gerät
                    // (z.B. als "ATMOTUBE") in der Liste zu finden.
                    acceptAllDevices: true,
                    
                    // ABER (und das ist der entscheidende Unterschied zu früher):
                    // Wir fordern den korrekten PRO-Dienst (`...0001...`) an.
                    // Das sollte den 'No Services matching...'-Fehler beheben.
                    optionalServices: [ATOMTUBE_PRO_SERVICE_UUID]
                });

                statusText.innerText = 'Verbinde mit GATT-Server...';
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
                bleServer = await bleDevice.gatt.connect();

                statusText.innerText = 'Suche AtmoTube PRO Dienst...';
                atmoTubeService = await bleServer.getPrimaryService(ATOMTUBE_PRO_SERVICE_UUID);

                statusText.innerText = 'Suche Charakteristiken...';
                
                // Alle 5 Charakteristiken holen
                pmChar = await atmoTubeService.getCharacteristic(PM_CHAR_UUID);
                vocChar = await atmoTubeService.getCharacteristic(VOC_CHAR_UUID);
                tempHumChar = await atmoTubeService.getCharacteristic(TEMP_HUM_CHAR_UUID);
                pressureChar = await atmoTubeService.getCharacteristic(PRESSURE_CHAR_UUID);
                co2Char = await atmoTubeService.getCharacteristic(CO2_CHAR_UUID);

                statusText.innerText = 'Verbunden! Bereit zum Starten.';
                connectButton.disabled = true;
                connectButton.classList.add('cursor-not-allowed', 'bg-gray-600');
                startButton.disabled = false;
                startButton.classList.remove('cursor-not-allowed', 'bg-gray-600');
                startButton.classList.add('bg-green-600', 'hover:bg-green-700');

            } catch (error) {
                console.error('Verbindungsfehler:', error);
                statusText.innerText = `Fehler: ${error.message}`;
                // Setze UI zurück, falls Fehler auftritt
                if (bleDevice) {
                    bleDevice.removeEventListener('gattserverdisconnected', onDisconnected);
                    if (bleServer && bleServer.connected) {
                        bleServer.disconnect();
                    }
                }
                bleDevice = null;
                connectButton.disabled = false;
                connectButton.classList.remove('cursor-not-allowed', 'bg-gray-600');
            }
        }

        function onDisconnected() {
            statusText.innerText = 'Verbindung verloren. Bitte neu verbinden.';
            stopMeasurement(); // Stoppt Messung, falls sie lief
            bleDevice = null;
            connectButton.disabled = false;
            connectButton.classList.remove('cursor-not-allowed', 'bg-gray-600');
            connectButton.classList.add('bg-blue-600', 'hover:bg-blue-700');
            startButton.disabled = true;
            startButton.classList.add('cursor-not-allowed', 'bg-gray-600');
            startButton.classList.remove('bg-green-600', 'hover:bg-green-700');
        }

        async function startMeasurement() {
            if (!bleDevice || !bleServer.connected) {
                statusText.innerText = 'Nicht verbunden.';
                return;
            }

            try {
                isMeasuring = true;
                statusText.innerText = 'Messung läuft...';
                statusDisplay.classList.add('status-pulsing');
                
                // CSV-Header erstellen
                csvContent = 'Timestamp,PM1 (ug/m3),PM2.5 (ug/m3),PM10 (ug/m3),VOC (ppm),Temperatur (C),Luftfeuchtigkeit (%),Luftdruck (hPa),CO2 (ppm)\n';

                // Notifications für alle Charakteristiken starten
                await pmChar.startNotifications();
                pmChar.addEventListener('characteristicvaluechanged', handlePmData);

                await vocChar.startNotifications();
                vocChar.addEventListener('characteristicvaluechanged', handleVocData);

                await tempHumChar.startNotifications();
                tempHumChar.addEventListener('characteristicvaluechanged', handleTempHumData);

                await pressureChar.startNotifications();
                pressureChar.addEventListener('characteristicvaluechanged', handlePressureData);

                await co2Char.startNotifications();
                co2Char.addEventListener('characteristicvaluechanged', handleCo2Data);

                // CSV-Zeile alle 5 Sekunden schreiben
                measurementInterval = setInterval(writeCsvRow, 5000);

                startButton.disabled = true;
                startButton.classList.add('cursor-not-allowed', 'bg-gray-600');
                startButton.classList.remove('bg-green-600', 'hover:bg-green-700');
                stopButton.disabled = false;
                stopButton.classList.remove('cursor-not-allowed', 'bg-gray-600');
                stopButton.classList.add('bg-red-600', 'hover:bg-red-700');

            } catch (error) {
                console.error('Fehler beim Starten der Messung:', error);
                statusText.innerText = `Start-Fehler: ${error.message}`;
                isMeasuring = false;
            }
        }

        async function stopMeasurement() {
            isMeasuring = false;
            clearInterval(measurementInterval); // Stoppt das Intervall
            statusText.innerText = 'Messung gestoppt. Speichere...';
            statusDisplay.classList.remove('status-pulsing');

            try {
                // Notifications stoppen
                if (pmChar) await pmChar.stopNotifications();
                if (vocChar) await vocChar.stopNotifications();
                if (tempHumChar) await tempHumChar.stopNotifications();
                if (pressureChar) await pressureChar.stopNotifications();
                if (co2Char) await co2Char.stopNotifications();

            } catch (error) {
                console.warn('Fehler beim Stoppen der Notifications:', error.message);
            }

            // UI zurücksetzen
            stopButton.disabled = true;
            stopButton.classList.add('cursor-not-allowed', 'bg-gray-600');
            stopButton.classList.remove('bg-red-600', 'hover:bg-red-700');
            startButton.disabled = false; // Erlaube neuen Start
            startButton.classList.remove('cursor-not-allowed', 'bg-gray-600');
            startButton.classList.add('bg-green-600', 'hover:bg-green-700');

            if (csvContent.length > 0) {
                downloadCsv();
            }
            csvContent = ''; // CSV-Inhalt für die nächste Messung zurücksetzen
            statusText.innerText = 'Verbunden. Bereit für nächste Messung.';
        }

        // --- DATEN-HANDLER (Aktualisiert für PRO-Modell) ---

        function handlePmData(event) {
            const value = event.target.value;
            // PM-Daten: 3x float (4 bytes, little-endian)
            currentAtmoTubeData.pm1 = value.getFloat32(0, true).toFixed(2);
            currentAtmoTubeData.pm2_5 = value.getFloat32(4, true).toFixed(2);
            currentAtmoTubeData.pm10 = value.getFloat32(8, true).toFixed(2);
        }

        function handleVocData(event) {
            const value = event.target.value;
            // VOC: 1x float (4 bytes, little-endian)
            currentAtmoTubeData.voc = value.getFloat32(0, true).toFixed(3);
        }

        function handleTempHumData(event) {
            const value = event.target.value;
            // Temp/Hum: 2x float (4 bytes, little-endian)
            currentAtmoTubeData.temperature = value.getFloat32(0, true).toFixed(2);
            currentAtmoTubeData.humidity = value.getFloat32(4, true).toFixed(2);
        }
        
        function handlePressureData(event) {
            const value = event.target.value;
            // Pressure: 1x float (4 bytes, little-endian)
            // Dokumentation sagt "Pascals (Pa)", CSV-Header "hPa" -> Umrechnung / 100
            currentAtmoTubeData.pressure = (value.getFloat32(0, true) / 100.0).toFixed(2);
        }
        
        function handleCo2Data(event) {
            const value = event.target.value;
            // CO2: 1x uint16_t (2 bytes, little-endian)
            currentAtmoTubeData.co2 = value.getUint16(0, true);
        }

        function writeCsvRow() {
            if (!isMeasuring) return;
            
            const now = new Date();
            const timestamp = now.toISOString();
            currentAtmoTubeData.timestamp = timestamp;

            const row = [
                timestamp,
                currentAtmoTubeData.pm1,
                currentAtmoTubeData.pm2_5,
                currentAtmoTubeData.pm10,
                currentAtmoTubeData.voc,
                currentAtmoTubeData.temperature,
                currentAtmoTubeData.humidity,
                currentAtmoTubeData.pressure,
                currentAtmoTubeData.co2
            ].join(',');
            
            csvContent += row + '\n';
        }

        function downloadCsv() {
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            const timestamp = new Date().toISOString().replace(/:/g, '-');
            const filename = `atmotube_pro_messung_${timestamp}.csv`;
            
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            statusText.innerText = 'CSV-Datei gespeichert!';
        }
    </script>
</body>
</html>
