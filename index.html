<!DOCTYPE html>
<html lang="de" class="h-full bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtmoTube PRO Logger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .status-pulsing { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-800 rounded-xl shadow-2xl p-6 md:p-8 border border-gray-700">
        
        <div class="flex items-center justify-center mb-6">
            <!-- Platzhalter-Logo oder Icon -->
            <svg class="w-12 h-12 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h1 class="text-3xl font-bold text-white ml-4">AtmoTube PRO</h1>
        </div>

        <p class="text-center text-lg text-gray-400 mb-8">CSV-Datenlogger für AtmoTube PRO</p>

        <div class="space-y-6">
            <!-- Statusanzeige -->
            <div id="statusDisplay" class="text-center bg-gray-900 rounded-lg p-4">
                <span id="statusText" class="text-lg font-medium text-blue-300">Bereit zum Verbinden</span>
            </div>

            <!-- Schritt 1: Verbinden -->
            <button id="connectButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:-translate-y-0.5">
                1. Mit AtmoTube PRO verbinden
            </button>

            <!-- Schritt 2: Messung starten -->
            <button id="startButton" class="w-full bg-gray-600 text-white font-bold py-3 px-4 rounded-lg cursor-not-allowed" disabled>
                2. Messung starten
            </button>

            <!-- Schritt 3: Messung stoppen -->
            <button id="stopButton" class="w-full bg-gray-600 text-white font-bold py-3 px-4 rounded-lg cursor-not-allowed" disabled>
                3. Messung stoppen & Speichern
            </button>
        </div>
        
    </div>

    <script>
        // --- AtmoTube PRO (Modell 2) UUIDs ---
        // Basierend auf https://support.atmotube.com/en/articles/10364981-bluetooth-api
        // Untere Tabelle "Atmotube PRO model / AtmoTube 2 model"
        
        // Der Hauptdienst, der alle Sensordaten bereitstellt
        const ATOMTUBE_PRO_SERVICE_UUID = '48280001-0000-1000-8000-00805f9b34fb';
        
        // PM (PM1, PM2.5, PM10)
        const PM_CHAR_UUID = '48280002-0000-1000-8000-00805f9b34fb';
        
        // VOC (flüchtige organische Verbindungen)
        const VOC_CHAR_UUID = '48280003-0000-1000-8000-00805f9b34fb';
        
        // Temperatur und Luftfeuchtigkeit
        const TEMP_HUM_CHAR_UUID = '48280004-0000-1000-8000-00805f9b34fb';
        
        // Luftdruck
        const PRESSURE_CHAR_UUID = '48280005-0000-1000-8000-00805f9b34fb';

        // CO2 (Kohlenstoffdioxid)
        const CO2_CHAR_UUID = '48280006-0000-1000-8000-00805f9b34fb';

        // Globale Variablen
        let bleDevice;
        let bleServer;
        let atmoTubeService;
        let csvContent = '';
        let isMeasuring = false;
        let measurementInterval;
        const MEASUREMENT_RATE_MS = 5000; // Alle 5 Sekunden eine CSV-Zeile

        // Charakteristiken
        let pmChar, vocChar, tempHumChar, pressureChar, co2Char;

        // Zustandsspeicherung für die Sensordaten
        let currentAtmoTubeData = {
            timestamp: '',
            pm1: 0.0,
            pm2_5: 0.0,
            pm10: 0.0,
            voc: 0.0,
            temperature: 0.0,
            humidity: 0.0,
            pressure: 0.0,
            co2: 0
        };

        // DOM-Elemente
        const connectButton = document.getElementById('connectButton');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const statusText = document.getElementById('statusText');
        const statusDisplay = document.getElementById('statusDisplay');

        // Event-Listener
        connectButton.addEventListener('click', connectToDevice);
        startButton.addEventListener('click', startMeasurement);
        stopButton.addEventListener('click', stopMeasurement);

        /**
         * Stellt die Verbindung zum AtmoTube PRO her.
         * Verwendet Plan F: Akzeptiert alle Geräte, da der PRO-Dienst nicht
         * passiv beworben wird. Fordert den Dienst optional an.
         */
        async function connectToDevice() {
            try {
                statusText.innerText = 'Suche Gerät...';
                
                // Gerätesuche über Web Bluetooth API (Plan F)
                // WICHTIG: "Standort" (GPS) muss auf dem Handy aktiviert sein!
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    // Wir MÜSSEN `acceptAllDevices: true` verwenden, um das Gerät
                    // (das sich als "Unbekanntes Gerät" meldet) überhaupt zu sehen.
                    acceptAllDevices: true,
                    
                    // Wir fordern den korrekten PRO-Dienst (`...0001...`) an,
                    // den wir nach der Verbindung nutzen wollen.
                    optionalServices: [ATOMTUBE_PRO_SERVICE_UUID]
                });

                statusText.innerText = 'Verbinde mit GATT-Server...';
                bleDevice.addEventListener('gattserverdisconnected', onDeviceDisconnected);
                bleServer = await bleDevice.gatt.connect();

                statusText.innerText = 'Hole AtmoTube-Dienst...';
                atmoTubeService = await bleServer.getPrimaryService(ATOMTUBE_PRO_SERVICE_UUID);

                statusText.innerText = 'Hole Charakteristiken...';
                // Alle 5 Charakteristiken parallel holen
                [pmChar, vocChar, tempHumChar, pressureChar, co2Char] = await Promise.all([
                    atmoTubeService.getCharacteristic(PM_CHAR_UUID),
                    atmoTubeService.getCharacteristic(VOC_CHAR_UUID),
                    atmoTubeService.getCharacteristic(TEMP_HUM_CHAR_UUID),
                    atmoTubeService.getCharacteristic(PRESSURE_CHAR_UUID),
                    atmoTubeService.getCharacteristic(CO2_CHAR_UUID)
                ]);

                statusText.innerText = 'Verbunden. Bereit zu starten.';
                statusDisplay.classList.remove('bg-gray-900');
                statusDisplay.classList.add('bg-green-800');
                connectButton.disabled = true;
                connectButton.classList.add('bg-gray-600', 'cursor-not-allowed');
                connectButton.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                
                startButton.disabled = false;
                startButton.classList.remove('bg-gray-600', 'cursor-not-allowed');
                startButton.classList.add('bg-green-600', 'hover:bg-green-700');

            } catch (error) {
                console.error('Verbindungsfehler:', error);
                statusText.innerText = `Fehler: ${error.message}`;
                statusDisplay.classList.remove('bg-gray-900', 'bg-green-800');
                statusDisplay.classList.add('bg-red-800');
            }
        }

        /**
         * Startet die Messung und abonniert alle Sensordaten.
         */
        async function startMeasurement() {
            if (!bleDevice || !bleDevice.gatt.connected) {
                statusText.innerText = 'Gerät nicht verbunden. Bitte neu verbinden.';
                return;
            }

            try {
                isMeasuring = true;
                csvContent = 'Timestamp;PM1 (ug/m3);PM2.5 (ug/m3);PM10 (ug/m3);VOC (ppb);Temperatur (C);Luftfeuchtigkeit (%);Luftdruck (hPa);CO2 (ppm)\n';

                statusText.innerText = 'Starte Benachrichtigungen...';
                
                // Event-Listener registrieren
                pmChar.addEventListener('characteristicvaluechanged', handlePmData);
                vocChar.addEventListener('characteristicvaluechanged', handleVocData);
                tempHumChar.addEventListener('characteristicvaluechanged', handleTempHumData);
                pressureChar.addEventListener('characteristicvaluechanged', handlePressureData);
                co2Char.addEventListener('characteristicvaluechanged', handleCo2Data);

                // Notifications für alle starten
                await pmChar.startNotifications();
                await vocChar.startNotifications();
                await tempHumChar.startNotifications();
                await pressureChar.startNotifications();
                await co2Char.startNotifications();

                // Intervall zum Schreiben der CSV-Zeilen starten
                measurementInterval = setInterval(writeCsvRow, MEASUREMENT_RATE_MS);

                statusText.innerText = 'Messung läuft...';
                statusDisplay.classList.add('status-pulsing');
                
                startButton.disabled = true;
                startButton.classList.add('bg-gray-600', 'cursor-not-allowed');
                startButton.classList.remove('bg-green-600', 'hover:bg-green-700');

                stopButton.disabled = false;
                stopButton.classList.remove('bg-gray-600', 'cursor-not-allowed');
                stopButton.classList.add('bg-red-600', 'hover:bg-red-700');

            } catch (error) {
                console.error('Fehler beim Starten der Messung:', error);
                statusText.innerText = `Fehler: ${error.message}`;
                statusDisplay.classList.remove('status-pulsing');
            }
        }

        /**
         * Stoppt die Messung und speichert die CSV-Datei.
         */
        async function stopMeasurement() {
            isMeasuring = false;
            if (measurementInterval) {
                clearInterval(measurementInterval);
                measurementInterval = null;
            }

            try {
                statusText.innerText = 'Stoppe Benachrichtigungen...';
                // Notifications stoppen
                await pmChar.stopNotifications();
                await vocChar.stopNotifications();
                await tempHumChar.stopNotifications();
                await pressureChar.stopNotifications();
                await co2Char.stopNotifications();

                // Event-Listener entfernen
                pmChar.removeEventListener('characteristicvaluechanged', handlePmData);
                vocChar.removeEventListener('characteristicvaluechanged', handleVocData);
                tempHumChar.removeEventListener('characteristicvaluechanged', handleTempHumData);
                pressureChar.removeEventListener('characteristicvaluechanged', handlePressureData);
                co2Char.removeEventListener('characteristicvaluechanged', handleCo2Data);
                
            } catch (error) {
                console.warn('Fehler beim Stoppen der Benachrichtigungen:', error);
            }

            statusText.innerText = 'Speichere CSV-Datei...';
            saveCsvFile();

            statusText.innerText = 'Messung gestoppt. Bereit für Neustart.';
            statusDisplay.classList.remove('status-pulsing');
            
            stopButton.disabled = true;
            stopButton.classList.add('bg-gray-600', 'cursor-not-allowed');
            stopButton.classList.remove('bg-red-600', 'hover:bg-red-700');

            startButton.disabled = false;
            startButton.classList.remove('bg-gray-600', 'cursor-not-allowed');
            startButton.classList.add('bg-green-600', 'hover:bg-green-700');
        }

        /**
         * Verarbeitet eingehende PM-Daten (Tabelle 2).
         * Format: PM1 (float, 4b), PM2.5 (float, 4b), PM10 (float, 4b)
         */
        function handlePmData(event) {
            const value = event.target.value;
            // true für little-endian
            currentAtmoTubeData.pm1 = value.getFloat32(0, true).toFixed(2);
            currentAtmoTubeData.pm2_5 = value.getFloat32(4, true).toFixed(2);
            currentAtmoTubeData.pm10 = value.getFloat32(8, true).toFixed(2);
        }

        /**
         * Verarbeitet eingehende VOC-Daten (Tabelle 3).
         * Format: VOC (float, 4b)
         */
        function handleVocData(event) {
            const value = event.target.value;
            currentAtmoTubeData.voc = value.getFloat32(0, true).toFixed(2);
        }

        /**
         * Verarbeitet eingehende Temperatur/Feuchtigkeits-Daten (Tabelle 4).
         * Format: Temperatur (float, 4b), Feuchtigkeit (float, 4b)
         */
        function handleTempHumData(event) {
            const value = event.target.value;
            currentAtmoTubeData.temperature = value.getFloat32(0, true).toFixed(2);
            currentAtmoTubeData.humidity = value.getFloat32(4, true).toFixed(2);
        }

        /**
         * Verarbeitet eingehende Luftdruck-Daten (Tabelle 5).
         * Format: Luftdruck (float, 4b)
         */
        function handlePressureData(event) {
            const value = event.target.value;
            // Doku sagt "float", also 4 bytes.
            currentAtmoTubeData.pressure = value.getFloat32(0, true).toFixed(2);
        }

        /**
         * Verarbeitet eingehende CO2-Daten (Tabelle 6).
         * Format: CO2 (uint16_t, 2b)
         */
        function handleCo2Data(event) {
            const value = event.target.value;
            // Doku sagt "uint16_t", also 2 bytes.
            currentAtmoTubeData.co2 = value.getUint16(0, true);
        }

        /**
         * Schreibt die aktuellen Sensordaten als neue Zeile in die CSV.
         */
        function writeCsvRow() {
            if (!isMeasuring) return;

            const now = new Date();
            currentAtmoTubeData.timestamp = formatDate(now);
            
            const row = [
                currentAtmoTubeData.timestamp,
                currentAtmoTubeData.pm1,
                currentAtmoTubeData.pm2_5,
                currentAtmoTubeData.pm10,
                currentAtmoTubeData.voc,
                currentAtmoTubeData.temperature,
                currentAtmoTubeData.humidity,
                currentAtmoTubeData.pressure,
                currentAtmoTubeData.co2
            ].join(';');
            
            csvContent += row + '\n';
        }

        /**
         * Speichert den CSV-Inhalt als Datei.
         */
        function saveCsvFile() {
            if (!csvContent) return;

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            
            const filename = `atmotube_pro_messung_${formatDate(new Date()).replace(/[:\s]/g, '_')}.csv`;
            link.setAttribute('download', filename);
            
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // CSV-Inhalt für die nächste Messung zurücksetzen
            csvContent = '';
        }

        /**
         * Wird aufgerufen, wenn die Verbindung zum Gerät getrennt wird.
         */
        function onDeviceDisconnected(event) {
            statusText.innerText = 'Verbindung getrennt. Bitte neu verbinden.';
            statusDisplay.classList.remove('bg-green-800', 'bg-red-800', 'status-pulsing');
            statusDisplay.classList.add('bg-gray-900');

            connectButton.disabled = false;
            connectButton.classList.remove('bg-gray-600', 'cursor-not-allowed');
            connectButton.classList.add('bg-blue-600', 'hover:bg-blue-700');
            
            startButton.disabled = true;
            startButton.classList.add('bg-gray-600', 'cursor-not-allowed');
            startButton.classList.remove('bg-green-600', 'hover:bg-green-700');
            
            stopButton.disabled = true;
            stopButton.classList.add('bg-gray-600', 'cursor-not-allowed');
            stopButton.classList.remove('bg-red-600', 'hover:bg-red-700');

            // Messung stoppen, falls sie lief
            if (isMeasuring) {
                isMeasuring = false;
                if (measurementInterval) {
                    clearInterval(measurementInterval);
                    measurementInterval = null;
                }
            }
        }

        /**
         * Formatiert ein Datumsobjekt in einen lesbaren String (YYYY-MM-DD HH:MM:SS).
         */
        function formatDate(date) {
            const Y = date.getFullYear();
            const M = String(date.getMonth() + 1).padStart(2, '0');
            const D = String(date.getDate()).padStart(2, '0');
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            return `${Y}-${M}-${D} ${h}:${m}:${s}`;
        }

    </script>
</body>
</html>
